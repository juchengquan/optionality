# The workspace's Python tooling (ADR 0014). The Python service that lived here was deleted in
# phase 10; the `python-before-phase-10` tag keeps it. The `optionality` package in python/ joins
# as this workspace's member when it is ported from the TypeScript (ADR 0014, step 5).
[project]
name = "optionality-workspace"
version = "0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
]

[tool.ruff]
line-length = 120
