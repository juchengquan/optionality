[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optionality"
version = "0.0.1"
requires-python = ">=3.12"
authors = [
    {name="juchengquan"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "yfinance",
    "tqdm",
    "moomoo-api",
    "pandas >= 2",
    "PyYAML >= 6",
    "pydantic[email]",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "sqlalchemy>=2",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
all = []

[dependency-groups]
dev = [
    "alembic>=1.19.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff",
]


[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
