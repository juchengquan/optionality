[project]
name = "optionality"
version = "0.1.0"
description = "SPX options maths and moomoo access, ported from the optionality service's TypeScript and held to it by golden cases."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
]

[project.optional-dependencies]
# the moomoo SDK, for live quotes. Heavy, and it blocks for ever on a dead port, so nothing else needs it.
opend = [
    "moomoo-api>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optionality"]

# The suite stays out of the sdist (ADR 0016). It cannot pass there: `tests/test_cases.py` reads
# testdata/golden/, which sits outside this directory and so cannot be carried — `uv build` was
# shipping a suite guaranteed to fail on `len(ALL) >= 100`. That guard was written for exactly this
# and caught it. Carrying the fixtures instead would be the right answer only if this package ever
# left the repository; while it is here, the suite's whole purpose is comparison against the
# canonical TypeScript beside it.
[tool.hatch.build.targets.sdist]
exclude = ["tests", ".ruff_cache"]

# the tools for this package's own suite and lint — `make test`, `make lint` and `make format` run them
# here, in python/. Not installed by a notebook that depends on the package.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
]

[tool.ruff]
line-length = 120
# where the package is, so `optionality` sorts as first-party in every checkout
src = ["src"]

[tool.ruff.lint.per-file-ignores]
# verify_contracts refuses on ANY failure, with what went wrong — the blind catch is its job
"src/optionality/quotes.py" = ["BLE001"]
