[project]
name = "optionality"
version = "2026.11.11"
description = "SPX options maths and moomoo access, ported from the optionality service's TypeScript and held to it by golden cases."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
]

[project.optional-dependencies]
# the moomoo SDK, for live quotes. Heavy, and it blocks for ever on a dead port, so nothing else needs it.
opend = [
    "moomoo-api>=10",
]
# yfinance, SHARED by the Yahoo port and the research half. One extra and not two, because it is
# one library: the port reads `regularMarketPrice` through it and `research.yahoo` reads chains and
# bars through it, and two extras pulling the same package would be a second thing to get right for
# no second thing installed. The line between port and research is an IMPORT rule
# (tests/test_standalone.py) and an extra cannot express it either way.
yahoo = [
    "yfinance>=1.8",
]
# everything, so a notebook can stop thinking about extras. Named rather than implied: a base
# dependency on yfinance would make pandas 3.x and numpy 2.x HARD requirements of the maths, and a
# notebook pinned to pandas 2.x could then not install this package at all. Measured: the base is
# 5 packages and 7.2 MB, and yfinance alone brings it to 22 and 107 MB.
# ib_async, for IB Gateway. BSD and maintained, where PyPI's `ibapi` is a third party's upload of
# IBKR's 2020 code under IBKR's own non-OSS licence, topping out at protocol 157 — exactly what the
# gateway here negotiates down to, so no headroom. The live gateway offers 178 and ib_async knows it.
# `optionality.ibkr` imports it inside the function that connects, so the mapping needs no extra.
ibkr = [
    "ib_async>=2.1",
]
all = [
    "optionality[opend,yahoo,ibkr]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optionality"]

# The suite stays out of the sdist (ADR 0016). It cannot pass there: `tests/test_cases.py` reads
# testdata/golden/, which sits outside this directory and so cannot be carried — `uv build` was
# shipping a suite guaranteed to fail on `len(ALL) >= 100`. That guard was written for exactly this
# and caught it. Carrying the fixtures instead would be the right answer only if this package ever
# left the repository; while it is here, the suite's whole purpose is comparison against the
# canonical TypeScript beside it.
[tool.hatch.build.targets.sdist]
exclude = ["tests", ".ruff_cache"]

# the tools for this package's own suite and lint — `make test`, `make lint` and `make format` run them
# here, in python/. Not installed by a notebook that depends on the package. And this package's own
# `ibkr` extra, named rather than repeated: the IB Gateway client is replayed against the recorded
# conversations, and the no-trading lint re-derives its names from the installed `ib_async` — a
# derivation the gate skipped would be a guard nobody runs, so it is installed and never skipped.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
    "optionality[ibkr]",
]

[tool.ruff]
line-length = 120
# where the package is, so `optionality` sorts as first-party in every checkout
src = ["src"]

[tool.ruff.lint.per-file-ignores]
# verify_contracts refuses on ANY failure, with what went wrong — the blind catch is its job
"src/optionality/quotes.py" = ["BLE001"]
