<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>optionality</title>
{%- for href in css %}
<link rel="stylesheet" href="{{ href }}">
{%- endfor %}
{#- the browser sees /opt/... while the app sees /..., so React is told where it lives
    rather than guessing. This is also why no client-side router: one page, no base path. -#}
<script>window.OPTIONALITY_ROOT = {{ root_path|tojson }};</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="{{ entry }}"></script>
</body>
</html>
