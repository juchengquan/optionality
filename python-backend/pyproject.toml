[project]
name = "optionality-backend"
# never released (ADR 0021): it runs from the working tree, as the TypeScript backend does, so it
# has no version anybody pins. The classifier makes PyPI refuse an upload by accident.
version = "0"
description = "The optionality service, in Python: the standby backend beside the TypeScript (ADR 0021)."
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
# the library, and nothing else yet: each dependency arrives with the code that uses it
dependencies = [
    "optionality",
]

[tool.uv.sources]
optionality = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optionality_backend"]

# the tools for this package's own suite and lint, as python/ has them
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
]

[tool.ruff]
line-length = 120
src = ["src"]
