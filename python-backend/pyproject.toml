[project]
name = "optionality-backend"
# never released (ADR 0021): it runs from the working tree, as the TypeScript backend does, so it
# has no version anybody pins. The classifier makes PyPI refuse an upload by accident.
version = "0"
description = "The optionality service, in Python: the standby backend beside the TypeScript (ADR 0021)."
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
# each dependency arrives with the code that uses it. `httpx2` is Pydantic's maintained
# continuation of `httpx` (ADR 0021, Decision 6), for Telegram: `telegram.py`. `fastapi` serves the
# HTTP door (`entrypoints/http/`), and `uvicorn` is what `__main__` will serve it on (phase 4) —
# here now because `tests/entrypoints/http/test_app.py` proves the app answers under it, on one loop.
# The library's three vendor extras arrive with the vendor door (`vendors/`), which opens all three
# clients: `opend` (the moomoo SDK), `yahoo` (yfinance) and `ibkr` (`ib_async`). No test reaches a
# vendor, so the suite would barely notice them missing — and the service would boot and then fail
# its first fetch.
dependencies = [
    "fastapi>=0.162.2",
    "httpx2>=2.16",
    "optionality[opend,yahoo,ibkr]",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
optionality = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optionality_backend"]

# the tools for this package's own suite and lint, as python/ has them. No `ib_async`: the no-trading
# lint's names are the library's (`optionality.no_trading`), and the library's suite re-derives them
# from the `ib_async` its own dev group installs; the backend's comes through the `ibkr` extra above,
# for the vendor door, and not for the lint. `pytest-asyncio`
# because the service is `async` from end to end (Decision 6), and its auto mode runs an
# `async def test_` as vitest runs an `async () =>` test: one test for one, with no marker each.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4",
    "ruff",
]

# Tests sit at the path of the module they test (README, "Porting a module"), so their basenames
# repeat — `engine/positions.test.ts` and `entrypoints/http/routes/positions.test.ts` both become a
# `test_positions.py` — and pytest's default import mode refuses two modules of one name. `importlib`
# imports each by its path instead, which also stops adding every test directory to `sys.path`;
# `pythonpath` puts back the one that holds the shared helpers (`reading.py`, `scenarios/`).
[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
src = ["src"]
